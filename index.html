<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYHAVEAN | STARGAZING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@100;300;400&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            color: white; font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            /* ARXA FON DAHA DA QARALDILDI */
            background: radial-gradient(ellipse at bottom, #0d1218 0%, #020204 100%);
        }

        /* ========== SAMANYOLU VƏ DAHA SIX ULDUZLAR ========== */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: 
                /* Realistik Samanyolu dumanlığı (Nebula) */
                radial-gradient(ellipse at 50% 60%, rgba(80, 80, 255, 0.12), rgba(0, 0, 0, 0) 50%),
                radial-gradient(ellipse at 30% 40%, rgba(120, 40, 200, 0.08), rgba(0, 0, 0, 0) 60%),
                
                /* Çoxaldılmış və müxtəlif ölçülü ulduzlar */
                radial-gradient(1px 1px at 25px 35px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.1px 1.1px at 40px 180px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 100px 50px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 250px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1.3px 1.3px at 200px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 300px 400px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 450px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.8px 1.8px at 500px 300px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 600px 500px, rgba(200, 220, 255, 0.7), rgba(0,0,0,0));

            background-repeat: repeat; 
            background-size: 
                250% 250%, 250% 250%, /* Dumanlıqlar */
                130px 130px, 180px 180px, 210px 210px, 
                250px 250px, 280px 280px, 320px 320px, 
                380px 380px, 450px 450px, 500px 500px;
                
            animation: starsMove 110s linear infinite; /* Daha real, çox yavaş axış */
            opacity: 0.85; 
        }

        @keyframes starsMove { from { background-position: 0 0; } to { background-position: 0 -10000px; } }

        .visitor-counter {
            position: fixed; top: 20px; right: 20px; font-size: 0.55rem;
            letter-spacing: 2px; color: rgba(255, 255, 255, 0.3); z-index: 100;
            background: rgba(255,255,255,0.03);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 0.5px solid rgba(255,255,255,0.05);
            font-family: 'Cinzel', serif;
        }

        .ui-wrapper {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transform: scale(1.05);
            transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ui-wrapper.active { opacity: 1; transform: scale(1); }

        /* ========== GATE PORTAL ========== */
        #gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 2s;
            overflow: hidden;
        }

        #gate::before {
            content: "";
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 50%, transparent 0%, transparent 35%, rgba(100,50,200,0.03) 40%, rgba(255,100,50,0.02) 45%, transparent 50%, rgba(50,100,255,0.015) 55%, transparent 60%);
            animation: accretionSpin 8s linear infinite;
        }

        @keyframes accretionSpin { from { transform: rotate(0deg) scale(1.5); } to { transform: rotate(360deg) scale(1.5); } }

        #gate p { 
            position: relative; z-index: 1001;
            letter-spacing: 12px; font-size: 0.7rem; color: rgba(255,255,255,0.6); 
            animation: portalPulse 2.5s ease-in-out infinite; 
            font-family: 'Cinzel', serif;
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border: 0.5px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            width: 200px; height: 200px;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
        }

        @keyframes portalPulse { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

        /* ========== AXAN ULDUZLAR ========== */
        .shooting-star {
            position: fixed; width: 2px; height: 2px; background: white;
            border-radius: 50%; box-shadow: 0 0 4px 2px rgba(255,255,255,0.3);
            z-index: 0; animation: shoot 3s linear infinite; pointer-events: none;
        }

        .shooting-star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; }
        .shooting-star:nth-child(2) { top: 30%; left: 90%; animation-delay: 1.5s; }
        .shooting-star:nth-child(3) { top: 60%; left: 70%; animation-delay: 3s; }

        @keyframes shoot {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(-300px, 150px); opacity: 0; }
        }

        /* ========== HEADER & CONTENT ========== */
        .header-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; z-index: 5; }
        
        .profile-container { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }

        .profile-img { 
            width: 55px; height: 55px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: url('https://i.ibb.co/mCMN0HHB/MG-0363.jpg') center/cover;
            box-shadow: 0 0 15px rgba(100,150,255,0.2);
            animation: profileGlitch 4s ease-in-out infinite;
        }

        @keyframes profileGlitch {
            0%, 90%, 100% { filter: none; transform: translate(0); }
            92% { filter: hue-rotate(90deg); transform: translate(2px, -1px); }
            94% { filter: hue-rotate(-90deg); transform: translate(-2px, 1px); }
        }

        .creator-text { 
            font-size: 0.65rem; letter-spacing: 2px; color: rgba(255, 255, 255, 0.4);
            background: rgba(255,255,255,0.03); padding: 4px 12px; border-radius: 12px;
            backdrop-filter: blur(4px); border-left: 1px solid rgba(100,150,255,0.15);
        }

        h1 {
            font-family: 'Cinzel', serif; font-size: 2.2rem; letter-spacing: 12px; margin: 0;
            background: linear-gradient(to right, #444 0%, #fff 50%, #444 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        .icon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; z-index: 5; }

        .icon-box {
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.02);
            border: 0.5px solid rgba(255, 255, 255, 0.05); border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); transition: all 0.4s;
        }

        .icon-box:hover { transform: scale(1.1); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

        .icon-box img { width: 35px; height: 35px; }

        .track-name { 
            margin-top: 60px; font-size: 0.6rem; letter-spacing: 6px; color: rgba(255, 255, 255, 0.4); 
            text-transform: uppercase; background: rgba(255,255,255,0.02);
            padding: 8px 24px; border-radius: 20px; border: 0.5px solid rgba(255,255,255,0.03);
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.6rem; letter-spacing: 8px; }
            .icon-grid { gap: 25px; }
            .icon-box { width: 65px; height: 65px; }
        }
    </style>
</head>
<body>

    <div class="stars-container"></div>
    <div class="visitor-counter">✦&ensp;Views: <span id="view-count">0</span></div>

    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <div id="gate" onclick="startApp()">
        <p>ENTER THE STARS</p>
    </div>

    <audio id="main-audio" preload="auto" loop>
       <source src="Xxx.mp3" type="audio/mpeg">
    </audio>

    <div class="ui-wrapper" id="ui">
        <div class="header-section">
            <div class="profile-container">
                <div class="profile-img"></div>
                <span class="creator-text">creator @Ryhavean <\> </span>
            </div>
            <h1>RYHAVEAN</h1>
        </div>
        
        <div class="icon-grid">
            <a href="https://t.me/rveanx" target="_blank"><div class="icon-box"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" style="filter: invert(1);"></div></a>
            <a href="https://instagram.com/" target="_blank"><div class="icon-box"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"></div></a>
            <a href="https://www.tiktok.com/" target="_blank"><div class="icon-box"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" style="filter: invert(1);"></div></a>
            <a href="https://discord.com/users/Ryhavean" target="_blank"><div class="icon-box"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png"></div></a>
        </div>

        <div class="track-name">la fiducia Uccide ¿!</div>
    </div>

    <script>
        function updateCounter() {
            let count = localStorage.getItem('page_view') || 0;
            count = Number(count) + 1;
            localStorage.setItem('page_view', count);
            document.getElementById('view-count').innerHTML = count;
        }
        window.onload = updateCounter;

        function startApp() {
            const audio = document.getElementById("main-audio");
            audio.play();
            document.getElementById("gate").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("gate").style.display = "none";
                document.getElementById("ui").classList.add("active");
            }, 1000);
        }
    </script>
</body>
</html>
